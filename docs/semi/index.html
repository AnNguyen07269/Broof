<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semi Quest · EECE 2077 catch-up game</title>
<meta name="description" content="A bite-sized game covering Semiconductor Devices (EECE 2077) Lectures 1–20: bands, diodes, BJTs, MOSFETs, LEDs, lasers.">
<meta name="theme-color" content="#0a0f1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f1f'/%3E%3Cpath d='M8 20H26C36 20 32 34 42 34H56' stroke='%234cc9f0' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 34H26C36 34 32 48 42 48H56' stroke='%23ffb703' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0f1f;--bg2:#0e1530;--panel:#121b38;--panel2:#18234a;--line:#26335f;--line2:#33437a;
  --text:#e9eeff;--muted:#93a1c8;--dim:#66749c;
  --e:#4cc9f0;--h:#ffb703;--ok:#2ee59d;--bad:#ff5d73;--warn:#ffcf5c;
  --wc:#4cc9f0;
  --r:16px;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:16px/1.5 var(--font);min-height:100vh;
  background:
    radial-gradient(1100px 600px at 85% -10%,rgba(76,201,240,.12),transparent 60%),
    radial-gradient(900px 600px at -10% 30%,rgba(255,183,3,.07),transparent 60%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/22px 22px,
    var(--bg);
  -webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
b{font-weight:700}
sub,sup{font-size:.72em;line-height:0}
:focus-visible{outline:2px solid var(--wc);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:64px;height:40px;flex:none;overflow:visible}
.lg-c{fill:none;stroke:var(--e);stroke-width:3;stroke-linecap:round}
.lg-v{fill:none;stroke:var(--h);stroke-width:3;stroke-linecap:round}
.lg-e{fill:var(--e)} .lg-h{fill:var(--h)}
.lg-t{font-weight:800;letter-spacing:.14em;font-size:20px}
.lg-s{color:var(--muted);font-size:12.5px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:17px;flex:none}
.icon-btn:hover{border-color:var(--line2)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.stat b{font-size:22px;color:var(--text);margin-right:2px;font-family:var(--mono)}
.stat small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.stat .bar{height:5px;background:var(--bg2);border-radius:9px;margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--e),var(--ok));border-radius:9px}

.cont{display:block;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--wc) 55%,transparent);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;position:relative;
  background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 20%,var(--panel)),var(--panel) 70%)}
.cont:hover{transform:translateY(-1px)}
.cont-k{font-size:11.5px;letter-spacing:.14em;color:var(--wc);font-weight:700}
.cont-t{font-size:21px;font-weight:750;margin:2px 0 4px;padding-right:70px}
.cont-s{color:var(--muted);font-size:14px}
.cont-go{position:absolute;right:16px;top:18px;background:var(--wc);color:#08101f;font-weight:800;border-radius:999px;padding:6px 12px;font-size:14px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.act{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.act:hover:not(:disabled){border-color:var(--line2);background:var(--panel2)}
.act:disabled{opacity:.5}
.act b{display:block;font-size:14px}.act small{color:var(--muted);font-size:12px}
.a-i{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--bg2);font-weight:800;color:var(--e)}

/* world map */
.world{margin:6px 0 4px}
.w-head{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--wc);border-radius:14px;padding:12px 14px}
.w-num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:19px;background:color-mix(in srgb,var(--wc) 22%,transparent);color:var(--wc);flex:none}
.w-name{font-weight:780;font-size:18px}
.w-sub{color:var(--muted);font-size:13px}
.w-prog{margin-left:auto;font-family:var(--mono);color:var(--wc);font-weight:700}
.map{position:relative;margin:0 4px}
.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.p-bg{fill:none;stroke:var(--line);stroke-width:10;vector-effect:non-scaling-stroke;stroke-linecap:round}
.p-fg{fill:none;stroke:var(--wc);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-dasharray:2 10;stroke-linecap:round;opacity:.8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.node{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid var(--wc);background:var(--bg2);display:grid;place-items:center;z-index:2;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .12s}
.node:hover{transform:translateY(-2px) scale(1.04)}
.node .n{font-weight:800;font-size:22px;font-family:var(--mono);color:var(--wc);line-height:1}
.node.done{background:var(--wc)} .node.done .n{color:#08101f}
.node .stars{position:absolute;bottom:-9px;display:flex;gap:2px}
.node .stars i{width:11px;height:11px;background:var(--line2);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.node .stars i.on{background:#ffd23f}
.node.next{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 0 color-mix(in srgb,var(--wc) 60%,transparent)}50%{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 12px transparent}}
.node.boss{width:80px;height:80px;border-radius:22px;transform:rotate(45deg);border-width:3px;background:linear-gradient(135deg,var(--panel2),var(--bg2))}
.node.boss .n{transform:rotate(-45deg);font-size:20px;letter-spacing:.04em}
.node.boss:hover{transform:rotate(45deg) scale(1.05)}
.node.boss.done{background:var(--wc)}
.node-l{position:absolute;transform:translateX(-50%);width:max-content;max-width:150px;text-align:center;font-size:12.5px;color:#b9c4e6;line-height:1.25;z-index:1;pointer-events:none;background:rgba(10,15,31,.92);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.boss-l{color:var(--wc);font-weight:700;letter-spacing:.02em}
.junction{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 12px}
.junction svg{width:120px;height:26px;flex:none}
.foot{color:var(--dim);font-size:12.5px;border-top:1px solid var(--line);margin-top:30px;padding-top:14px}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:650}
.btn:hover:not(:disabled){border-color:var(--wc)}
.btn.primary{background:var(--wc);color:#07101e;border-color:transparent;font-weight:800}
.btn.primary:disabled{background:var(--line);color:var(--muted)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.big{padding:13px 22px;font-size:16px}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row.end{justify-content:flex-end}.row.wrap{flex-wrap:wrap}

/* runner */
.run-top{display:flex;align-items:center;gap:12px;padding:4px 0 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent)}
.run-title{flex:1;min-width:0}
.run-title small{display:block;color:var(--wc);font-size:11px;letter-spacing:.12em;font-weight:700}
.run-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.run-xp{font-family:var(--mono);color:var(--ok);font-weight:700;font-size:14px}
.combo{font-size:13px;font-weight:800;color:#ffd23f;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.prog{display:flex;gap:4px;margin:2px 0 14px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.prog i.done{background:var(--wc)}.prog i.miss{background:color-mix(in srgb,var(--bad) 70%,var(--line))}
.prog i.cur{background:color-mix(in srgb,var(--wc) 45%,var(--line))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.card.enter{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card-k{color:var(--dim);font-size:12px;letter-spacing:.06em;margin-bottom:10px}
.idea{border-left:3px solid var(--wc);background:color-mix(in srgb,var(--wc) 8%,transparent);border-radius:0 12px 12px 0;padding:10px 14px;margin-bottom:16px;font-size:16.5px}
.idea-t{display:inline-block;font-size:10.5px;letter-spacing:.16em;font-weight:800;color:var(--wc);margin-bottom:2px}
.idea b{color:#fff}
.q-text{font-weight:650;font-size:17px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--wc);transform:translateX(2px)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:0 6px;margin-top:2px;flex:none}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg2));opacity:.75;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.num-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num-in{flex:1;min-width:180px;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;color:var(--text);font:16px var(--mono)}
.num-in:focus{outline:none;border-color:var(--wc)}
.num-in.right{border-color:var(--ok)}.num-in.wrong{border-color:var(--bad)}
.unit{color:var(--muted);font-family:var(--mono)}
.fb{display:none;margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.show{display:block;animation:in .2s}
.fb.good{background:color-mix(in srgb,var(--ok) 11%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fb.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.fb-h{font-weight:800}
.fb.good .fb-h{color:var(--ok)}.fb.bad .fb-h{color:var(--bad)}.fb.warn .fb-h{color:var(--warn)}
.fb-ans{margin-top:4px}
.fb-x{margin-top:6px;color:#cfd8f7}
.fb-x span{display:inline-block;font-size:10.5px;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-right:8px;text-transform:uppercase}
.run-foot{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px max(16px,calc(50% - 364px)) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.run-foot:empty{display:none}
.foot-hint{color:var(--dim);font-size:12.5px;margin-right:auto}

/* sort + match */
.sort-slots{list-style:none;counter-reset:s;padding:0;margin:0 0 10px;display:grid;gap:6px}
.slot{counter-increment:s;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line2);border-radius:10px;padding:8px 10px;min-height:42px}
.slot::before{content:counter(s);font-family:var(--mono);color:var(--wc);font-weight:800;width:18px}
.slot.filled{border-style:solid;background:var(--bg2)}
.slot.ok{border-color:var(--ok)}
.slot .ph{color:var(--dim);font-size:13px}
.sort-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:5px 11px;font-size:13px}
.chip.big{border-radius:10px;padding:8px 12px;font-size:14.5px;text-align:left}
.chip:hover:not(:disabled){border-color:var(--wc)}
.chip.used{opacity:.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m-hint{color:var(--muted);font-size:13px;margin-bottom:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-col{display:grid;gap:8px;align-content:start}
.m-item{text-align:left;background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14.5px}
.m-item.sel{border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 18%,transparent)}
.m-item.right{border-color:var(--ok)!important}.m-item.wrong{border-color:var(--bad)!important}

/* results */
.results{text-align:center;padding:34px 18px 10px}
.r-k{color:var(--wc);letter-spacing:.18em;font-size:12px;font-weight:800}
.results h2{font-size:28px;margin:6px 0 2px}
.r-sub{color:var(--muted)}
.big-stars{display:flex;justify-content:center;gap:12px;margin:22px 0}
.big-stars i{width:58px;height:58px;background:var(--line2);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.big-stars i.on{background:#ffd23f;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.r-stats{display:flex;justify-content:center;gap:16px;margin-bottom:18px}
.r-stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px}
.r-stats b{display:block;font-size:24px;font-family:var(--mono)}
.r-stats small{color:var(--muted);font-size:12px}
.r-vault{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 auto 6px}
.r-vk{font-weight:750;margin-bottom:8px;color:var(--wc)}
.f-list{display:flex;flex-wrap:wrap;gap:7px}
.f{font:13.5px/1.4 var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:5px 9px;color:#dfe7ff}
.results .row{justify-content:center}

/* boss */
.boss-hud{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.boss-hud.hit .hp-bar{animation:shake .3s}
.hp{flex:1}.hp small{color:var(--wc);font-weight:800;letter-spacing:.06em}
.hp-bar{height:12px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-top:3px}
.hp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#ff8a3d);transition:width .4s}
.hearts{font-size:22px;letter-spacing:2px}
.hearts span{color:var(--line2)}.hearts span.on{color:var(--bad)}
.hearts.lost{animation:shake .4s}
.boss-intro{text-align:center;padding:30px 10px}
.boss-intro p{color:var(--muted);max-width:460px;margin:6px auto 14px}
.boss-intro .m-list{display:inline-block;text-align:left}
.boss-face{font-size:44px;font-weight:900;font-family:var(--mono);color:var(--wc);margin:14px auto 4px;width:96px;height:96px;display:grid;place-items:center;border:3px solid var(--wc);border-radius:26px;transform:rotate(45deg)}
.boss-face>*{transform:rotate(-45deg)}
.timer{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;width:100%;background:var(--wc);transition:width .1s linear}

/* vault */
.v-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chk{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
.v-world{margin-bottom:18px}
.v-world h3{margin:0 0 8px;color:var(--wc);font-size:17px}
.v-level{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.v-lh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:650;font-size:14px;margin-bottom:8px}
.v-level.locked .f-list{filter:blur(5px);opacity:.5;user-select:none;pointer-events:none}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.75);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:22px;max-width:480px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.m-k{color:var(--e);letter-spacing:.18em;font-size:12px;font-weight:800}
.modal h2{margin:4px 0 10px;font-size:23px}
.m-list{margin:0;padding-left:18px;color:#cfd8f7}
.m-list li{margin:6px 0}
.xp-float{position:fixed;z-index:60;transform:translate(-50%,0);font-weight:800;color:var(--ok);font-family:var(--mono);pointer-events:none;animation:up 1.1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes up{to{transform:translate(-50%,-46px);opacity:0}}
.fx{position:fixed;inset:0;z-index:70;pointer-events:none}

/* labs */
.lab{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:12px}
.lab-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lab-tag{font-size:10px;font-weight:800;letter-spacing:.16em;background:var(--wc);color:#07101e;border-radius:6px;padding:2px 6px}
.lab-title{font-weight:700;font-size:14.5px}
.lab-stage{background:#070b18;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lab-svg{display:block;width:100%;height:auto;font-family:var(--font)}
.lab-controls{display:grid;gap:10px;margin:12px 2px 6px}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.slider{display:block}
.sl-top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.sl-lab{color:var(--muted)}
.sl-val{font-family:var(--mono);font-weight:700}
.sl-val em{font-style:normal;color:var(--wc);font-family:var(--font);font-weight:600;margin-left:4px}
input[type=range]{width:100%;accent-color:var(--wc);height:28px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg-b{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.seg-b.on{background:var(--wc);color:#07101e;font-weight:750}
.lab-readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:6px 0}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ro b{color:var(--text);font-family:var(--mono);font-size:12.5px;text-align:right}
.ro.wide{grid-column:1/-1;color:var(--text);font-size:13.5px}
.missions{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.mission{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:#cfd8f7}
.m-box{width:18px;height:18px;border-radius:6px;border:2px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px}
.mission.done{color:var(--ok)}

        el("button", { type: "button", class: "btn ghost", onclick: () => go("home") }, "Map"),
        !win ? el("button", { type: "button", class: "btn ghost", onclick: () => go("mix") }, "Mistake Mixer") : null,
        el("button", { type: "button", class: "btn " + (win && nb ? "ghost" : "primary"), onclick: () => { route(); } }, win ? "Fight again" : "Retry"),
        win && nb ? el("button", { type: "button", class: "btn primary", onclick: () => go("level-" + nb.levels[0].id) }, "Next world: " + nb.name + " →") : null)));
  }
  app.replaceChildren(wrap);
  window.scrollTo(0, 0);
  intro();
}

/* Mixer / quick review */
function playReview(mode) {
  let items;
  if (mode === "mix") items = shuffle(S.mistakes.filter(q => QBY[q])).slice(0, 12).map(q => ({ step: QBY[q].step, level: QBY[q].level, qid: q }));
  else {
    const cleared = LEVELS.filter(l => S.levels[l.id] && S.levels[l.id].done);
    const src = (cleared.length ? cleared : LEVELS);
    items = shuffle(src.flatMap(l => l.steps.map((s, i) => ({ step: s, level: l, qid: l.id + "." + i }))).filter(x => isQ(x.step))).slice(0, 10);
  }
  if (!items.length) { go("home"); return; }
  runSteps({
    mode, kicker: mode === "mix" ? "MISTAKE MIXER" : "QUICK 10", title: mode === "mix" ? "Fix what you missed" : "Random review", color: mode === "mix" ? "#ff8a3d" : "#2ee59d",
    items,
    onFinish: ({ res, xpGain }) => {
      const first = res.filter(r => r === "first").length;
      results({ kick: mode === "mix" ? "MIXER COMPLETE" : "REVIEW COMPLETE", title: mode === "mix" ? "Mixer done" : "Quick 10 done", sub: mode === "mix" ? (S.mistakes.length ? S.mistakes.length + " still in the mixer" : "Mixer is empty. Clean sweep.") : "Nice work keeping the streak.", stars: first / items.length >= 0.9 ? 3 : first / items.length >= 0.7 ? 2 : 1, first, total: items.length, xp: xpGain, color: mode === "mix" ? "#ff8a3d" : "#2ee59d", replay: mode });
    }
  });
}

/* Vault */
function viewVault() {
  keyHandler = null;
  let showAll = false, q = "";
  const wrap = el("div", { class: "vault" });
  const list = el("div");
  const search = el("input", { class: "num-in", type: "search", placeholder: "Search formulas (e.g. V_0, β, 1240)", "aria-label": "Search formulas", oninput: e => { q = e.target.value.toLowerCase(); paint(); } });
  const tog = el("label", { class: "chk" }, el("input", { type: "checkbox", onchange: e => { showAll = e.target.checked; paint(); } }), " Show locked too");
  function paint() {
    list.replaceChildren(...WORLDS.map(w => {
      const levels = w.levels.map(l => {
        const unlocked = S.levels[l.id] && S.levels[l.id].done;
        const fs = l.v.filter(f => !q || f.toLowerCase().includes(q) || l.t.toLowerCase().includes(q));
        if (!fs.length) return null;
        return el("div", { class: "v-level" + (unlocked || showAll ? "" : " locked") },
          el("div", { class: "v-lh" }, el("span", null, "L" + l.n + " · " + l.t), unlocked ? null : el("button", { type: "button", class: "btn ghost sm", onclick: () => go("level-" + l.id) }, "🔒 clear to unlock")),
          el("div", { class: "v-body" }, l.vf ? el("div", { class: "vis sm" }, renderFig(l.vf)) : null, el("div", { class: "f-list" }, fs.map(f => el("code", { class: "f", html: fmt(f) })))));
      }).filter(Boolean);
      if (!levels.length) return null;
      return el("section", { class: "v-world", style: { "--wc": w.color } }, el("h3", null, w.name), levels);
    }).filter(Boolean));
  }
  const unlockedN = LEVELS.filter(l => S.levels[l.id] && S.levels[l.id].done).length;
  wrap.append(
    el("div", { class: "run-top" }, el("button", { type: "button", class: "icon-btn", "aria-label": "Back", onclick: () => go("home") }, "✕"), el("div", { class: "run-title" }, el("small", null, "∑ VISUAL VAULT"), el("b", null, unlockedN + " of " + LEVELS.length + " lectures unlocked"))),
    el("div", { class: "v-tools" }, search, tog), list);
  paint();
  app.replaceChildren(wrap);
  window.scrollTo(0, 0);
}

/* Deploy helper (artifact build only): copy the clean source to the clipboard */
function viewCopy() {
  keyHandler = null;
  const ta = el("textarea", { class: "num-in", style: { width: "100%", height: "260px", fontSize: "11px" }, readonly: true });
  const msg = el("div", { class: "r-sub" }, "Loading…");
  const btn = el("button", { type: "button", class: "btn primary big", id: "copy-src", onclick: async () => {
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = "Copied " + ta.value.length + " characters."; }
    catch (e) { ta.focus(); ta.select(); msg.textContent = "Clipboard blocked: text selected, press Ctrl+C."; }
  } }, "Copy source");
  fetch("src.txt").then(r => r.ok ? r.text() : Promise.reject(r.status)).then(t => { ta.value = t; msg.textContent = t.length + " characters ready."; }).catch(err => { msg.textContent = "Source not available here (" + err + ")."; });
  app.replaceChildren(el("div", { class: "results" }, el("div", { class: "r-k" }, "DEPLOY HELPER"), el("h2", null, "Copy the deployable source"), msg, el("div", { class: "row" }, btn), ta));
}

/* Router */
function route() {
  document.querySelectorAll(".overlay").forEach(o => o.remove());
  const h = location.hash.replace(/^#/, "");
  let m;
  if (h === "copy-source" && window.SQ_COPY) return viewCopy();
  if (h === "vault") return viewVault();
  if (h === "mix") return playReview("mix");
  if (h === "quick") return playReview("quick");
  if ((m = h.match(/^level-(L\d+)$/)) && LEVEL[m[1]]) return playLevel(LEVEL[m[1]]);
  if ((m = h.match(/^boss-(B\d+)$/)) && BOSS[m[1]]) return playBoss(BOSS[m[1]]);
  return viewHome();
}
window.addEventListener("hashchange", route);
route();
window.__SQ = { S, LEVELS, WORLDS, parseNum, numOk, fmt };
})();

</script>
</body>
