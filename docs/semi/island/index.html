<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semi Quest · Silicon Island</title>
<meta name="description" content="Semiconductor Devices (EECE 2077) as a cozy island game: notebook diagrams, 3D parts, real-world uses.">
<meta name="theme-color" content="#f7f2e7"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='24' rx='13' ry='4' fill='%239fd8cf' stroke='%2326221d' stroke-width='1.6'/%3E%3Cpath d='M6 23q10-10 20 0z' fill='%23a6cf8a' stroke='%2326221d' stroke-width='1.6'/%3E%3Cpath d='M17 17V8' stroke='%2326221d' stroke-width='1.6'/%3E%3Cpath d='M17 9q-5-3-8 1M17 9q5-3 8 1' fill='none' stroke='%233f8f5a' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2e7;--paper2:#efe7d6;--card:#fffdf8;--grid:#ebe3d1;--ink:#26221d;--ink2:#6e665a;--ink3:#a59c8c;--line:#d9cfba;
  --blue:#2f6bd3;--blue-l:#e1eafb;--blue-d:#1d4a9a;--red:#d4483b;--red-l:#fae2de;--red-d:#9b2f25;
  --orange:#e98a25;--orange-l:#fdebd3;--green:#2f9a5d;--green-l:#dcf1e4;--green-d:#1f6e42;
  --coral:#e0735a;--coral-l:#fbe3dc;--coral-d:#a9452f;--purple:#6b5bd2;--purple-l:#e9e5fb;--purple-d:#463a9c;--gold:#f2b632;--gold-l:#fdf0cc;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;background-position:-1px -1px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue-d)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 80px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* chunky buttons with an ink lip */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;background:var(--card);box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s,background .15s;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{background:#ebe4d4;color:var(--ink3);border-color:#cfc5b0;box-shadow:0 4px 0 #cfc5b0;cursor:default}
.iconbtn{border:2px solid var(--ink);background:var(--card);border-radius:12px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper) 78%,transparent)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:20px;margin-right:auto}
.brand svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 11px 4px 6px;background:var(--card);font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--ink)}
.chip svg{flex:none}

/* island hero */
.island{position:relative;height:300px;margin:4px -16px 0;overflow:hidden}
.island canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.island .ttl{position:absolute;left:16px;top:8px;pointer-events:none}
.island .ttl b{display:block;font-family:var(--serif);font-size:24px;font-weight:700}
.island .ttl span{font-family:var(--hand);font-size:19px;color:var(--ink2)}
.islabels{position:absolute;inset:0;pointer-events:none}
.islabel{position:absolute;transform:translate(-50%,-100%);font-family:var(--hand);font-size:17px;line-height:1;white-space:nowrap;padding:1px 6px;border-radius:6px;background:rgba(255,253,248,.82);border:1.5px solid var(--ink);color:var(--ink)}
.islabel.ghost{border-style:dashed;color:var(--ink2);background:rgba(255,253,248,.6)}
.islabel.new{background:var(--gold-l);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

/* cards */
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.plan{display:flex;gap:14px;align-items:center;padding:14px 16px;margin:6px 0 22px}
.plan .pk{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.plan .pt{font-family:var(--serif);font-size:19px;font-weight:600;margin:2px 0}
.plan .ps{font-size:14px;color:var(--ink2)}
.plan .grow{flex:1;min-width:0}

/* path */
.world{margin:26px 0 8px}
.wband{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--ink);border-radius:16px;background:var(--wc);color:#fff;box-shadow:0 4px 0 var(--ink)}
.wband .wn{font-family:var(--serif);font-size:19px;font-weight:700}
.wband .ws{font-size:13px;font-weight:700;opacity:.92}
.wband .grow{flex:1}
.ready{min-width:118px;text-align:right;font-size:12px;font-weight:800}
.ready .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.35);border:1.5px solid var(--ink);margin-top:4px;overflow:hidden}
.ready .bar i{display:block;height:100%;background:#fff}
.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 0 6px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:8px 0}
.node{position:relative;width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.node.cur{background:var(--wc)}
.node.done{background:var(--wc)}
.node.legacy{border-style:dashed;box-shadow:0 6px 0 #cfc5b0;border-color:#9d927d;background:var(--paper)}
.node.review{width:58px;height:58px;background:var(--purple-l);border-color:var(--purple-d);box-shadow:0 5px 0 var(--purple-d)}
.node.review.due{background:var(--purple)}
.node.chamber{width:84px;height:84px;border-radius:22px;background:#3a332b}
.node.chamber.locked{background:#cfc5b0}
.node .ring{position:absolute;inset:-9px;border-radius:50%;border:3px solid transparent}
.node.cur .ring{border-color:var(--wc);opacity:.45;animation:pulse 1.6s ease-in-out infinite}
.nlabel{margin-top:12px;font-weight:800;font-size:13px;text-align:center;max-width:150px;line-height:1.25}
.nlabel small{display:block;font-weight:700;color:var(--ink2);font-size:12px}
.bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--wc2,var(--ink));animation:bob 1.4s ease-in-out infinite;box-shadow:0 3px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translate(-50%,-6px) rotate(45deg)}
.mastery{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);display:flex;align-items:center;justify-content:center}
.foot{margin-top:40px;text-align:center;font-size:13px;color:var(--ink2)}
.foot button{background:none;border:none;text-decoration:underline;color:var(--ink2);font-size:13px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(38,34,29,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.bsheet{width:100%;max-width:600px;background:var(--card);border:2px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;padding:20px 20px 28px;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.bsheet h3{font-size:22px;margin-bottom:6px}
.bsheet p{color:var(--ink2);margin:6px 0 16px;line-height:1.5}
.bsheet .row{display:flex;gap:10px;flex-wrap:wrap}

/* lesson runner */
.lesson{max-width:640px;margin:0 auto;padding:0 16px;min-height:100vh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 0 6px;position:sticky;top:0;background:var(--paper);z-index:10}
.prog{flex:1;display:flex;gap:5px}
.seg{flex:var(--n);height:14px;border:2px solid var(--ink);border-radius:8px;background:var(--card);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--bc);transition:width .35s}
.beatchip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--bc);margin:8px 0 2px}
.beatchip .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--bc)}
.stage{flex:1;padding-bottom:150px}
.card{animation:slide .28s cubic-bezier(.2,.9,.3,1)}
.vis{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--ink);margin:6px 0 14px;overflow:hidden}
.vis.paper{background-color:#fffdf8;background-image:linear-gradient(#f0e9da 1px,transparent 1px),linear-gradient(90deg,#f0e9da 1px,transparent 1px);background-size:20px 20px}
.vis svg.fig{display:block;width:100%;height:auto}
.cap{font-size:17px;line-height:1.45;margin:0 2px 10px;font-weight:600}
.cap .hl-e{color:var(--blue);font-weight:800}.cap .hl-h{color:var(--red);font-weight:800}.cap .hl-f{color:var(--orange);font-weight:800}
.q{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3;margin:4px 2px 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-weight:700;font-size:16px}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink2);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.opt.sel{background:var(--blue-l);border-color:var(--blue-d);box-shadow:0 3px 0 var(--blue-d)}
.opt.sel .k{border-color:var(--blue-d);color:var(--blue-d)}
.opt.right{background:var(--green-l);border-color:var(--green-d);box-shadow:0 3px 0 var(--green-d)}
.opt.wrong{background:var(--red-l);border-color:var(--red-d);box-shadow:0 3px 0 var(--red-d);opacity:.75}
.opt:disabled{cursor:default}
.picks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.picks.one{grid-template-columns:1fr}
.pick{position:relative;border:2px solid var(--ink);border-radius:16px;background:#fffdf8;padding:8px 8px 6px;box-shadow:0 4px 0 var(--ink)}
.pick svg{display:block;width:100%;height:auto}
.pick .tag{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);background:var(--card);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pick.sel{border-color:var(--blue-d);box-shadow:0 4px 0 var(--blue-d);background:var(--blue-l)}
.pick.right{border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d);background:var(--green-l)}
.pick.wrong{border-color:var(--red-d);box-shadow:0 4px 0 var(--red-d);background:var(--red-l);opacity:.7}
.spot-live [data-zone]{cursor:pointer}
.zone{fill:transparent;stroke:transparent;stroke-width:2.5;transition:fill .15s,stroke .15s}
.spot-live .zone{stroke:var(--ink3);stroke-dasharray:6 5}
.spot-live .zone:hover{fill:rgba(47,107,211,.08);stroke:var(--blue)}
.zone.z-ok{fill:rgba(47,154,93,.18)!important;stroke:var(--green)!important;stroke-dasharray:none!important}
.zone.z-bad{fill:rgba(212,72,59,.12)!important;stroke:var(--red)!important;stroke-dasharray:none!important}
.hint-tap{font-family:var(--hand);font-size:21px;color:var(--blue-d);margin:2px 4px}
.numrow{display:flex;gap:10px;align-items:center}
.numrow input{flex:1;min-width:0;font:700 20px var(--mono);padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:inset 0 2px 0 rgba(0,0,0,.05)}
.numrow input:focus{outline:3px solid var(--blue-l);border-color:var(--blue-d)}
.numrow .u{font-weight:800;font-size:18px;color:var(--ink2)}
.formula{font-family:var(--serif);font-size:20px;text-align:center;padding:8px 6px 4px}
.formula .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.formula .fr span:first-child{border-bottom:2px solid var(--ink);padding:0 4px}
.given{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 2px}
.given span{font-family:var(--mono);font-size:14px;font-weight:700;border:1.5px solid var(--ink);border-radius:8px;padding:3px 8px;background:var(--paper)}
.nudge{font-family:var(--hand);font-size:22px;color:var(--red-d);margin:10px 4px 0;min-height:24px}
.mission{display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:10px 12px;border:2px dashed var(--ink2);border-radius:14px;font-weight:700}
.mission .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;background:var(--card)}
.mission.done{border-style:solid;border-color:var(--green-d);background:var(--green-l)}
.mission.done .box{background:var(--green)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:4px 2px 10px}
.ctrl label{font-weight:800;font-size:14px;min-width:34px}
.ctrl input[type=range]{flex:1;min-width:140px;accent-color:var(--ink);height:28px}
.ctrl .val{font-family:var(--mono);font-weight:700;font-size:15px;min-width:78px;text-align:right}
.readout{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.readout div{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:var(--card);font-weight:800;font-size:14px}
.readout div b{font-family:var(--mono);font-size:16px}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.conf .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:14px 8px}
.conf .opt small{font-weight:600;color:var(--ink2);font-size:12px}

/* footer bar + feedback */
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:2px solid var(--ink);background:var(--paper);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.lfoot .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.lfoot.ok{background:var(--green-l)}
.lfoot.bad{background:var(--red-l)}
.lfoot.info{background:var(--blue-l)}
.fb{display:none;gap:12px;align-items:flex-start;animation:up .2s}
.lfoot.ok .fb,.lfoot.bad .fb,.lfoot.info .fb{display:flex}
.fb .badge{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--card)}
.fb .ft{font-family:var(--serif);font-size:20px;font-weight:700}
.lfoot.ok .ft{color:var(--green-d)}.lfoot.bad .ft{color:var(--red-d)}.lfoot.info .ft{color:var(--blue-d)}
.fb .fx{font-size:15px;line-height:1.45;margin-top:2px}
.fb .gain{font-family:var(--hand);font-size:22px;color:var(--blue-d);margin-left:6px}
.fbfig{margin-top:8px;border:2px solid var(--ink);border-radius:12px;background:#fffdf8;padding:6px;max-width:420px}
.fbfig svg{display:block;width:100%;height:auto;max-height:150px;margin:0 auto}

/* beat splash */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:52vh;gap:10px;animation:slide .3s}
.splash .big{width:120px;height:120px;border-radius:30px;border:3px solid var(--ink);background:var(--bc);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.splash h2{font-size:32px;margin-top:10px}
.splash p{font-family:var(--hand);font-size:24px;color:var(--ink2);margin:0}
.splash .n{font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--ink2)}

/* 3D lab */
.lab3d{position:relative;height:330px;margin:-10px;background:#fffdf8}
.lab3d canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.lab3d .lbls{position:absolute;inset:0;pointer-events:none;font-family:var(--hand);font-size:19px}
.lab3d .lbls div{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(255,253,248,.85);padding:0 5px;border-radius:5px}
.lab3d .hud{position:absolute;right:10px;top:10px;display:flex;gap:8px;align-items:center}
.bulb{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center}
.lab3d .drag{position:absolute;left:12px;top:8px;font-family:var(--hand);font-size:18px;color:var(--ink2);pointer-events:none}

/* results */
.results{text-align:center;padding:30px 0 120px}
.results h1{font-size:34px;margin:8px 0 4px}
.results .sub{font-family:var(--hand);font-size:24px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{border:2px solid var(--ink);border-radius:16px;padding:10px 6px;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.stat .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:2px}
.reward{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;margin:14px 0}
.reward .rk{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.reward .rt{font-family:var(--serif);font-size:19px;font-weight:600}
.reward .rs{font-size:14px;color:var(--ink2)}
.reward .art{flex:none;width:110px}
.reward .art svg{display:block;width:100%;height:auto}

/* binder */
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:12px 0 40px}
.pcard{border:2px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--ink);padding:10px;text-align:left}
.pcard.locked{border-style:dashed;box-shadow:none;background:transparent;color:var(--ink2)}
.pcard .pa{background:#fffdf8;border:1.5px solid var(--line);border-radius:10px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.pcard .pa svg{width:90%;height:auto}
.pcard .pn{font-family:var(--serif);font-weight:700;font-size:17px}
.pcard .pl{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.pcard ul{margin:6px 0 0;padding-left:16px;font-size:13px;line-height:1.45;color:var(--ink2)}

/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;padding:30px 20px;gap:16px}
.onb h1{font-size:36px;line-height:1.1}
.onb p{font-size:17px;line-height:1.5;color:var(--ink2);margin:0}
.goal{display:grid;gap:10px}

/* character animation */
.bob{animation:bob 1.8s ease-in-out infinite;transform-box:fill-box}
.eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.burst{animation:burst .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:3 9;animation:flow .7s linear infinite}
.draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);animation:draw 1.2s ease-out forwards}

/* ---------- PN junction scene (interactive) ---------- */
function pnLayout(asym) {

}
function pnScene(host, o = {}) {
  seed(o.asym ? 21 : 11);
  const L = pnLayout(o.asym), J = 300, apart = o.state === "apart";
  const off = apart ? 26 : 0;

/* ---------- band diagrams ---------- */
function band(kind, o = {}) {

  else ef = cur(ecL + g / 2, ecR + g / 2);

/* V0 lab: sliders + live band diagram */

   ${hand(110, 252, "p side", { size: 24, fill: REDD, anchor: "middle" })}${hand(400, 252, "n side", { size: 24, fill: BLUED, anchor: "middle" })}
   <text class="t-it lblc" font-size="17">E<tspan font-size="12" dy="3">C</tspan></text><text class="t-it lblv" font-size="17">E<tspan font-size="12" dy="3">V</tspan></text><text class="t-it lblf" font-size="17" fill="#b56411">E<tspan font-size="12" dy="3">F</tspan></text></svg></div>

   <div class="readout"><div>V<sub>0</sub> = <b class="v0"></b></div></div>`;

  const sup = v => "10" + String(v % 1 ? v.toFixed(1) : v).replace(/[-0-9.]/g, c => "⁻⁰¹²³⁴⁵⁶⁷⁸⁹·"["-0123456789.".indexOf(c)]);
  const upd = () => {
    const a = +na.value, d = +nd.value, V0 = 0.0259 * Math.log(Math.pow(10, a + d) / 2.25e20);
    const step = 82 * V0, ecL = 40, ecR = ecL + step, g = 92, x1 = 200, x2 = 300, L = 40, R = 470;
    const cur = (y1, y2) => `M${L} ${y1}H${x1}C${x1 + 50} ${y1} ${x2 - 50} ${y2} ${x2} ${y2}H${R}`;
    q(".ec").setAttribute("d", cur(ecL, ecR)); q(".ev").setAttribute("d", cur(ecL + g, ecR + g));
    const efy = ecL + g - 82 * (0.56 - 0.0259 * Math.log(Math.pow(10, a) / 1.5e10)); q(".ef").setAttribute("d", `M${L} ${efy}H${R}`);
    q(".ecd").setAttribute("d", `M${L} ${ecL}H420`); q(".br").setAttribute("d", `M426 ${ecL}V${ecR - 4}`);

    q(".lblc").setAttribute("x", 476); q(".lblc").setAttribute("y", ecR + 5); q(".lblv").setAttribute("x", 476); q(".lblv").setAttribute("y", ecR + g + 5); q(".lblf").setAttribute("x", 4); q(".lblf").setAttribute("y", efy - 6);
    q(".nav").textContent = sup(a) + " cm⁻³"; q(".ndv").textContent = sup(d) + " cm⁻³"; q(".v0").textContent = V0.toFixed(2) + " V";
    if (V0 > 0.8) ctx && ctx.mission && ctx.mission(true);

  na.oninput = nd.oninput = upd; upd();
}

}
function trio(o = {}) {
  const rev = !!o.reveal;
  return svg("0 0 600 330", `<defs>${arrowDefs("arT", INK)}${arrowDefs("arTG", GRN)}</defs>
  <path d="M110 58H262M338 58H490" stroke="${INK}" stroke-width="3"/><path d="M262 28L330 58L262 88Z" fill="${PAPER}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M332 26V90" stroke="${INK}" stroke-width="4"/>
